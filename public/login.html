<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - PuhunanPH</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="login">
  <main class="container">
    <div class="card grid" style="max-width:460px;margin:40px auto;">
      <h1 class="page-title">Login</h1>
      <form id="loginForm" class="grid">
        <input id="mobile" class="input" placeholder="Mobile Number" required />
        <div class="grid" style="grid-template-columns:1fr auto;gap:8px;">
          <input id="password" class="input" type="password" placeholder="Password" required />
          <button type="button" class="btn btn-outline" data-toggle-password="password">Show</button>
        </div>
        <label class="muted" style="display:flex;align-items:center;gap:8px;">
          <input id="rememberLogin" type="checkbox" />
          Save mobile number and password on this device
        </label>
        <button class="btn btn-primary" type="submit">Login</button>
      </form>
      <p class="muted">No account? <a href="register.html">Register</a></p>
    </div>
  </main>
  <script type="module" src="assets/js/pages.js"></script>
</body>
</html>
