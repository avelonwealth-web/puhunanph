<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - PuhunanPH</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="dashboard">
  <main class="container grid">
    <div class="card">
      <p class="muted">USER</p>
      <p id="homeUserMobile" class="balance">-</p>
    </div>
    <div class="card ads-banner" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <div>
        <p class="muted">Daily Wallet Balance</p>
        <p id="walletBalance" class="balance">PHP 0.00</p>
        <p class="muted">Click ads to claim +PHP10 (once per day, auto credit)</p>
      </div>
      <button id="adsRewardBtn" class="btn btn-primary">Watch Ads +PHP10</button>
    </div>
    <section class="grid grid-2">
      <article class="card">
        <p class="muted">Deposits</p>
        <p id="dashDepositBalance" class="balance">PHP 0.00</p>
      </article>
      <article class="card">
        <p class="muted">Trading Earnings</p>
        <p id="dashTradingEarnings" class="balance">PHP 0.00</p>
      </article>
      <article class="card">
        <p class="muted">Commission Income</p>
        <p id="dashCommissionIncome" class="balance">PHP 0.00</p>
      </article>
      <article class="card">
        <p class="muted">Daily Product Income</p>
        <p id="dashDailyIncome" class="balance">PHP 0.00</p>
      </article>
    </section>
    <h1 class="page-title">Investment Products</h1>
    <section id="productCards" class="grid grid-3"></section>
  </main>
  <button id="supportBtn" class="support-btn">TG</button>
  <nav id="bottomNav" class="bottom-nav"></nav>
  <script type="module" src="assets/js/pages.js"></script>
</body>
</html>
