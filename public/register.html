<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - PuhunanPH</title>
  <meta name="description" content="Create your PuhunanPH account with a referral invite link." />
  <link rel="canonical" href="https://puhunan-ph.xyz/register.html" />
  <meta property="og:site_name" content="PuhunanPH" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Register | PuhunanPH" />
  <meta property="og:description" content="Join PuhunanPH — investment &amp; referral platform." />
  <meta property="og:url" content="https://puhunan-ph.xyz/register.html" />
  <meta property="og:image" content="https://puhunan-ph.xyz/images/logo.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Register | PuhunanPH" />
  <meta name="twitter:description" content="Join PuhunanPH with an invite link." />
  <meta name="twitter:image" content="https://puhunan-ph.xyz/images/logo.png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="register">
  <main class="container">
    <div class="card grid" style="max-width:460px;margin:40px auto;">
      <h1 class="page-title">Register</h1>
      <form id="registerForm" class="grid" autocomplete="on">
        <input id="mobile" class="input" placeholder="Mobile Number" autocomplete="username" inputmode="numeric" required />
        <div class="grid" style="grid-template-columns:1fr auto;gap:8px;">
          <input id="password" class="input" type="password" placeholder="Password" autocomplete="new-password" required />
          <button type="button" class="btn btn-outline" data-toggle-password="password">Show</button>
        </div>
        <div class="grid" style="grid-template-columns:1fr auto;gap:8px;">
          <input id="confirmPassword" class="input" type="password" placeholder="Confirm Password" autocomplete="new-password" required />
          <button type="button" class="btn btn-outline" data-toggle-password="confirmPassword">Show</button>
        </div>
        <input id="referralCode" class="input" placeholder="Referral / Invite Code" autocomplete="off" required />
        <button class="btn btn-primary" type="submit">Create Account</button>
      </form>
      <p class="muted">Already have account? <a href="login.html">Login</a></p>
    </div>
  </main>
  <script type="module" src="assets/js/pages.js?v=20260218"></script>
  <script>
    (function () {
      function referralFromLocation() {
        var p = new URLSearchParams(location.search);
        var keys = ["ref", "referral", "invite", "code"];
        for (var i = 0; i < keys.length; i++) {
          var v = p.get(keys[i]);
          if (v && String(v).trim()) return String(v).trim();
        }
        var path = location.pathname || "";
        var m = path.match(/^\/r\/([^/]+)\/?$/i);
        if (!m) return "";
        try {
          return decodeURIComponent(m[1]).trim();
        } catch (e) {
          return m[1].trim();
        }
      }
      function applyRefFromQuery() {
        var ref = referralFromLocation();
        if (!ref) return;
        var inp = document.getElementById("referralCode");
        if (inp) inp.value = ref;
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", applyRefFromQuery);
      } else {
        applyRefFromQuery();
      }
    })();
  </script>
</body>
</html>
