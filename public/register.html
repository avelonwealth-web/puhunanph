<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - PuhunanPH</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="register">
  <main class="container">
    <div class="card grid" style="max-width:460px;margin:40px auto;">
      <h1 class="page-title">Register</h1>
      <form id="registerForm" class="grid">
        <input id="mobile" class="input" placeholder="Mobile Number" required />
        <div class="grid" style="grid-template-columns:1fr auto;gap:8px;">
          <input id="password" class="input" type="password" placeholder="Password" required />
          <button type="button" class="btn btn-outline" data-toggle-password="password">Show</button>
        </div>
        <div class="grid" style="grid-template-columns:1fr auto;gap:8px;">
          <input id="confirmPassword" class="input" type="password" placeholder="Confirm Password" required />
          <button type="button" class="btn btn-outline" data-toggle-password="confirmPassword">Show</button>
        </div>
        <input id="referralCode" class="input" placeholder="Referral / Invite Code" required />
        <button class="btn btn-primary" type="submit">Create Account</button>
      </form>
      <p class="muted">Already have account? <a href="login.html">Login</a></p>
    </div>
  </main>
  <script type="module" src="assets/js/pages.js"></script>
  <script>
    const ref = new URLSearchParams(location.search).get("ref");
    if (ref) document.addEventListener("DOMContentLoaded", () => {
      const inp = document.getElementById("referralCode");
      inp.value = ref;
    });
  </script>
</body>
</html>
