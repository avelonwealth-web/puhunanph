services:
  # Web: "free" spins down after idle (~15 min) → cold starts; every deploy sends SIGTERM to the old instance (normal).
  # For always-on (no idle spin-down), upgrade this service in the Render dashboard to a paid instance type, or set e.g. plan: starter here (billable).
  - type: web
    name: puhunanph-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: PAYMONGO_SOURCE_TYPE
        value: qrph
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_ACTION_SECRET
        sync: false
      - key: ADMIN_MOBILE
        value: 09152444480

  # 17:00 UTC = 01:00 next calendar day in Asia/Manila (UTC+8)
  - type: cron
    name: puhunanph-daily-rewards
    runtime: node
    rootDir: backend
    schedule: "0 17 * * *"
    buildCommand: npm install
    startCommand: >
      node -e "const base=(process.env.BACKEND_BASE_URL||'').replace(/\/$/,'');if(!base){console.error('BACKEND_BASE_URL is required');process.exit(1)}fetch(base+'/api/run-daily-rewards',{method:'POST',headers:{'x-cron-secret':process.env.CRON_SECRET}}).then(r=>r.text()).then(t=>{console.log(t);process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: BACKEND_BASE_URL
        sync: false
